[package]
name = "stormflow"
version = "0.1.0"
authors = ["Jarle Kramer <jarle.kramer@gmail.com>"]
description = "A CFD solver specialized for actuator line simulations with the Stormbird library"
homepage = "https://github.com/NTNU-IMT/stormbird"
readme = "README.md"
repository = "https://github.com/NTNU-IMT/stormbird"
license = "GPL-3.0-only"
edition = "2024"
exclude = [".cargo", "AGENTS.md"]

[dependencies]
bytemuck = "1.25.0"
clap = { version = "4.5.53", features = ["derive"] }
pollster = "1.0.1"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
stormath = {version = "0.3.0", features=["single_precision"]}
stormbird = {version = "0.10.0", features=["single_precision"]}
wgpu = "30.0.0"
console = "0.15"
gag = "1.0"

[profile.release]
lto = "fat"
codegen-units = 1
