[package]
name = "pystormflow"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pystormflow"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.0"
stormath = {version = "0.3.0", features=["single_precision"]}
stormbird = { path="../../stormbird", features=["single_precision"]}
stormflow = { path="../../stormflow" }
