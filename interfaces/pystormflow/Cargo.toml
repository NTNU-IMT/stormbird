[package]
name = "pystormflow"
version = "0.3.0"
authors = ["Jarle Kramer <jarle.kramer@gmail.com>"]
description = "Python interface to the Stormflow CFD solver."
homepage = "https://github.com/NTNU-IMT/stormbird"
readme = "README.md"
repository = "https://github.com/NTNU-IMT/stormbird"
license = "GPL-3.0-only"
edition = "2024"

[lib]
name = "pystormflow"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.0"
stormath = {version = "0.4.0", features=["single_precision"]}
stormbird = { path = "../../stormbird", version = "0.11.1", features = ["single_precision"] }
stormflow = { path = "../../stormflow", version = "0.3.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
