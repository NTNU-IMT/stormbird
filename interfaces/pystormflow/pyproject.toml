[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "pystormflow"
dynamic = ["version"]
description = "Python interface to Stormflow, a CFD solver specialized for actuator line simulations with Stormbird."
authors = [{ name = "Jarle Kramer", email = "jarle.kramer@gmail.com" }]
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
keywords = ["wind propulsion", "actuator line", "CFD", "aerodynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/NTNU-IMT/stormbird"
Repository = "https://github.com/NTNU-IMT/stormbird"
Documentation = "https://jarlekramer.github.io/stormbird_book_pages/"

[tool.maturin]
module-name = "pystormflow._native"
python-source = "."
features = ["pyo3/extension-module"]
profile = "release"
# The examples are not needed in the source distribution
exclude = [
    { path = "examples/**/*", format = "sdist" },
]
