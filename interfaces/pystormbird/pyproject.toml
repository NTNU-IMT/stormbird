[build-system]
requires = ["maturin>=1.14"]
build-backend = "maturin"

[project]
name = "pystormbird"
dynamic = ["version"]
description = "Python interface to the Stormbird library for simulating lifting surfaces."
authors = [{ name = "Jarle Kramer", email = "jarle.kramer@gmail.com" }]
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
keywords = ["wind propulsion", "lifting line", "actuator line", "aerodynamics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/NTNU-IMT/stormbird"
Repository = "https://github.com/NTNU-IMT/stormbird"
Documentation = "https://jarlekramer.github.io/stormbird_book_pages/"

[tool.maturin]
module-name = "pystormbird._native"
python-source = "."
features = ["pyo3/extension-module"]
profile = "release"
# The examples, the lock file of the development environment and the notes for the maintainer are
# not needed in the source distribution
exclude = [
    { path = "examples/**/*", format = "sdist" },
    { path = "uv.lock", format = "sdist" },
    { path = "maintainer_cheat_sheet.md", format = "sdist" },
]

[tool.uv]
# Rebuild when the Rust code changes, so that `uv sync` in the examples picks up changes automatically
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
]
