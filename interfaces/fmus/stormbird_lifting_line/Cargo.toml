[package]
name = "stormbird_lifting_line"
version = "0.13.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
fmu_from_struct = "0.3.0"

stormbird = { version = "0.13.0", path = "../../../stormbird" }
stormath = { version = "0.4.1", path = "../../../stormath" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[features]
default = ["fmi2"]
# The version of the FMI standard. Exactly one of these must be active. Use, e.g.,
# `--no-default-features --features fmi3` to build an FMU for version 3.
fmi2 = []
fmi3 = []
parallel = ["stormbird/parallel"]

# Panics must unwind, so that they can be caught and reported as an error code, rather than crashing
# the importer of the FMU. This is the default, but it is set explicitly as a reminder.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
