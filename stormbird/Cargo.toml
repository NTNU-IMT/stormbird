[package]
name = "stormbird"
version = "0.11.1"
authors = ["Jarle Kramer <jarle.kramer@gmail.com>"]
description = "A library for modeling modern wind propulsion devices"
homepage = "https://github.com/NTNU-IMT/stormbird"
readme = "README.md"
repository = "https://github.com/NTNU-IMT/stormbird"
license = "GPL-3.0-only"
keywords = ["lifting-line", "actuator-line", "aerodynamics", "wind-propulsion", "simulation"]
categories = ["science", "simulation"]
edition = "2021"
rust-version = "1.85"
exclude = ["test_output"]

[dependencies]
stormath = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rayon = { version = "1.12.0", optional = true }

[features]
padded_spatial_vectors = ["stormath/padded_spatial_vectors"]
single_precision = ["stormath/single_precision"]
parallel = ["rayon"]

[profile.release]
lto = "fat"
